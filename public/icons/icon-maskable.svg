
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bg)" />

  <rect x="64" y="64" width="384" height="384" rx="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Emblem Group -->
  <g transform="translate(256, 235)" filter="url(#shadow)">
    <!-- Outer Shield / Diamond Motif -->
    <path d="M 0 -130 L 110 -40 L 80 110 L -80 110 L -110 -40 Z" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Scale of Justice / Land Pillar -->
    <path d="M 0 -90 L 0 70 M -60 -30 L 60 -30 M -60 -30 L -90 20 M -30 -30 L -60 20 M 60 -30 L 90 20 M 30 -30 L 60 20" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none" />
    
    <!-- Center AI Sparkle -->
    <circle cx="0" cy="-30" r="14" fill="#a855f7" />
    <path d="M 0 -50 L 0 -10 M -20 -30 L 20 -30" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Tamil Text Branding -->
  <text x="256" y="425" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="2">
    நிலம் 360 AI
  </text>
</svg>
